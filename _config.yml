title: Sara Marolt
description: Seabird Ecology | Statistical modelling
url: "https://sara-marolt.github.io"
locale: en-US

remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: mint   # try: default, dirt, sunrise, aqua, air, neon

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache      # required by Minimal Mistakes
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap

paginate: 5
paginate_path: "/page:num/"

author:
  name: Sara Marolt
  avatar: /assets/images/profile.jpg
  bio: "PhD Student at the Animal Flight Lab, Lund University"
  links:
    - label: Email
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:sara.marolt@biol.lu.se"
    - label: LinkedIn
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/sara-marolt-15957a19a/"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
